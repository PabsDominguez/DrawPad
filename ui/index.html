<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DrawPad</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body class="dark">
<div id="bar">
  <button id="fit" title="Fit all (⇧1)">Fit</button>
  <button id="theme" title="Dark / light">◐</button>
  <span class="sep"></span>
  <span id="selbar"></span>
  <span class="grow"></span>
  <span id="status"></span>
</div>
<aside id="outline"></aside>
<main id="view">
  <div id="world"><svg id="arrows"></svg></div>
  <div id="hint"></div>
  <div id="zoom"><button id="zout" title="Zoom out">−</button><button id="zpct" title="Back to 100% (⇧0)">100%</button><button id="zin" title="Zoom in">+</button></div>
  <div id="tools">
    <button data-tool="select" class="on" title="Select and move (V)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
    <button data-tool="comment" title="Comment: click a spot or drag a region on an item (C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <button data-tool="frame" title="Frame: drag out a box; what's inside joins it (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg></button>
    <span class="tsep"></span>
    <button data-tool="line" title="Line (L) · Shift snaps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="arrow" title="Arrow (A)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button data-tool="rect" title="Rectangle (R)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-tool="ellipse" title="Ellipse (O)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
  </div>
</main>
<script type="module" src="/ui/app.ts"></script>
</body>
</html>
