<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DrawPad</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body class="dark">
<div id="bar">
  <button data-tool="select" class="on" title="Select and move (V)">Select</button>
  <button data-tool="comment" title="Click a spot or drag a region on an item (C)">Comment</button>
  <span class="sep"></span>
  <button id="fit" title="Fit all (F)">Fit</button>
  <button id="theme" title="Dark / light">◐</button>
  <span class="sep"></span>
  <span id="selbar"></span>
  <span class="grow"></span>
  <span id="status"></span>
</div>
<aside id="outline"></aside>
<main id="view">
  <div id="world"><svg id="arrows"></svg></div>
  <div id="hint"></div>
</main>
<script type="module" src="/ui/app.ts"></script>
</body>
</html>
